<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Формуляр AS350B3e № 9157</title>
<meta name="formular-app" content="2.1.0">
<style>
/* Електронний формуляр ПС. Один файл: програма + дані. Працює без інтернету в будь-якому сучасному браузері. */
:root {
  --bg: #eef0f2; --surface: #ffffff; --surface-2: #f6f7f8; --line: #dcdfe4; --line-soft: #e9ebee;
  --text: #1c2229; --muted: #5d6672; --faint: #8d95a1;
  --accent: #2f5d7c; --accent-strong: #244a63; --accent-soft: #e3edf3; --on-accent: #ffffff;
  --go: #4d7350; --on-go: #ffffff;
  --bad: #c2492f; --bad-bg: #fbe9e4; --warn: #9a6407; --warn-bg: #fcf1dc; --ok: #3f6b3c; --ok-bg: #e5f0e3; --chg: #6a4fa8; --chg-bg: #eee8f8;
  --paper: #ffffff; --ink: #000000;
  --shadow: 0 1px 2px rgba(20,30,40,.06), 0 8px 24px rgba(20,30,40,.08);
  --ui: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", Arial, sans-serif;
  --print: Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171b; --surface: #1b2026; --surface-2: #21272e; --line: #2e363f; --line-soft: #262d35;
  --text: #dfe5eb; --muted: #9aa6b2; --faint: #6e7986;
  --accent: #7fb0d1; --accent-strong: #a2c7e0; --accent-soft: #1f3241; --on-accent: #0d1720;
  --go: #86b386; --on-go: #0e1a0e;
  --bad: #f08a72; --bad-bg: #3a211b; --warn: #f0bf5f; --warn-bg: #352a14; --ok: #93c58f; --ok-bg: #1c2c1b; --chg: #b9a2f0; --chg-bg: #2a2440;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13171b; --surface: #1b2026; --surface-2: #21272e; --line: #2e363f; --line-soft: #262d35;
  --text: #dfe5eb; --muted: #9aa6b2; --faint: #6e7986;
  --accent: #7fb0d1; --accent-strong: #a2c7e0; --accent-soft: #1f3241; --on-accent: #0d1720;
  --go: #86b386; --on-go: #0e1a0e;
  --bad: #f08a72; --bad-bg: #3a211b; --warn: #f0bf5f; --warn-bg: #352a14; --ok: #93c58f; --ok-bg: #1c2c1b; --chg: #b9a2f0; --chg-bg: #2a2440;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: var(--accent); }

.wrap { max-width: 1320px; margin: 0 auto; padding-block: 14px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.ident { display: flex; align-items: center; gap: 14px; min-width: 0; }
.spine-ico { width: 42px; height: 52px; flex: none; border-radius: 3px 8px 8px 3px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 11px/1 var(--print); letter-spacing: .04em; box-shadow: inset 5px 0 0 rgba(0,0,0,.18); }
.ident h1 { margin: 0; font-size: 21px; line-height: 1.2; text-wrap: balance; }
.ident .sub { color: var(--muted); font-size: 13px; }
.ident .sub b { color: var(--text); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; white-space: nowrap; font-size: 13.5px; line-height: 1.3; text-decoration: none; color: var(--text); }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.go { background: var(--go); border-color: var(--go); color: var(--on-go); font-weight: 600; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.chg { background: var(--chg-bg); color: var(--chg); }
.chip.muted { background: var(--surface-2); color: var(--muted); }
.who { font-size: 12.5px; color: var(--muted); }
.who b { color: var(--text); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; text-decoration: underline; text-underline-offset: 2px; }

.rems { display: flex; flex-direction: column; gap: 8px; }
.rem { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; border-left: 4px solid currentColor; }
.rem span { min-width: 0; flex: 1 1 300px; color: var(--text); }
.rem.warn { background: var(--warn-bg); color: var(--warn); } .rem.bad { background: var(--bad-bg); color: var(--bad); } .rem.info { background: var(--accent-soft); color: var(--accent); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { font-size: 11.5px; color: var(--faint); margin-left: 3px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.panel-h h2 { margin: 0; font-size: 15px; }
.panel-b { padding: 14px 16px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.empty b { color: var(--text); display: block; font-size: 15px; margin-bottom: 4px; }

.spreads { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.sp { position: relative; flex: none; display: flex; flex-direction: column; align-items: flex-start; padding: 7px 13px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; min-width: 108px; overflow: hidden; color: var(--text); }
.sp b { font-size: 13.5px; } .sp span { font-size: 11.5px; color: var(--muted); } .sp em { font-style: normal; color: var(--warn); font-weight: 600; }
.sp i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); opacity: .5; }
.sp[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.tw { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); padding: 8px 9px; border-bottom: 1px solid var(--line); vertical-align: bottom; line-height: 1.25; background: var(--surface-2); }
table.grid td { padding: 9px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.grid tr.e { cursor: pointer; }
table.grid tr.e:hover td:not(.sp-col) { background: var(--accent-soft); }
table.grid .pg-h th { background: var(--surface); color: var(--text); font-size: 12.5px; }
table.grid .pg-h th span { color: var(--faint); font-weight: 400; }
table.grid .sp-col { width: 8px; min-width: 8px; padding: 0; background: linear-gradient(90deg, var(--line-soft), var(--bg) 50%, var(--line-soft)); border-bottom: 0; }
table.grid .txt { min-width: 130px; white-space: pre-line; }
table.grid .wd { min-width: 200px; white-space: pre-line; }
table.grid .nw { white-space: nowrap; }
table.grid .sig { min-width: 150px; font-size: 12px; line-height: 1.45; }
tr.voided td:not(.sp-col) { color: var(--faint); }
tr.voided td.wd, tr.voided td.txt { text-decoration: line-through; text-decoration-color: var(--bad); }
.flags { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-top: 4px; }
.cards { display: none; flex-direction: column; }
.card { text-align: left; border: 0; border-bottom: 1px solid var(--line-soft); background: none; padding: 13px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; color: var(--text); width: 100%; }
.card:last-child { border-bottom: 0; }
.card .what { font-size: 14px; line-height: 1.4; white-space: pre-line; }
.card.voided .what { text-decoration: line-through; color: var(--faint); }
.card dl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 0; }
.card dt { font-size: 11px; color: var(--faint); } .card dd { margin: 0; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.card .meta { font-size: 12.5px; color: var(--muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

.fab { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: inline-flex; align-items: center; gap: 8px; padding: 13px 20px 13px 16px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 15px; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 40%, transparent); cursor: pointer; }
.fab svg { width: 20px; height: 20px; }

/* перегляд сторінок на екрані */
.preview { display: flex; flex-direction: column; gap: 10px; }
.pv-stage { overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.pv-inner { transform-origin: top left; display: flex; gap: 6mm; width: max-content; }
.pv-inner .pg { box-shadow: 0 2px 10px rgba(0,0,0,.18); }

/* реєстр повноважень, журнал */
.auth-list { display: flex; flex-direction: column; }
.holder { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); align-items: start; }
.holder:last-child { border-bottom: 0; }
.holder h3 { margin: 0; font-size: 15px; }
.auths { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.auth { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; background: var(--surface-2); text-align: left; cursor: pointer; color: var(--text); }
.auth b { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.auth .o { font-size: 11px; color: var(--muted); display: block; }
.auth.off { opacity: .55; }
.log { display: flex; flex-direction: column; }
.log-i { padding: 10px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 14px; }
.log-i:last-child { border-bottom: 0; }
.log-i ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.log-i s { color: var(--bad); }

/* діалоги */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(620px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 16, 22, .45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
.dlg-h { padding: 14px 18px 10px; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dlg-h h2 { margin: 0; font-size: 17px; }
.dlg-h .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.dlg-b { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-f { padding: 12px 18px; border-top: 1px solid var(--line-soft); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dlg-f .r { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.fs { display: flex; flex-direction: column; gap: 10px; }
.fs > h4 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.full { grid-column: 1 / -1; }
.fld label { font-size: 12.5px; color: var(--muted); }
.fld input, .fld select, .fld textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 15px; }
.fld textarea { min-height: 76px; resize: vertical; }
.fld .hint { font-size: 12px; color: var(--faint); }
.fld.err > input, .fld.err > select, .fld.err > textarea, .fld.err .hmf input { border-color: var(--bad); }
.fld .msg { font-size: 12px; color: var(--bad); }
.check { flex-direction: row; align-items: center; gap: 8px; }
.check input { width: auto; }
.calcbox { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line-soft); }
.calcbox div { min-width: 0; } .calcbox span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.25; }
.calcbox b { font-size: 16px; font-variant-numeric: tabular-nums; } .calcbox i { display: block; font-style: normal; font-size: 11px; color: var(--faint); }
.calcbox .man b { color: var(--chg); } .calcbox .bad b, .calcbox .bad i { color: var(--bad); }
.pick { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.pick-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.pick-h b { font-size: 13px; }
.pick .std { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); white-space: pre-line; }
.majorchk { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); cursor: pointer; }
.majorchk:has(input:checked) { border-color: var(--chg); background: var(--chg-bg); }
.majorchk input { margin-top: 3px; } .majorchk span { font-size: 13px; } .majorchk small { display: block; color: var(--muted); font-size: 12px; }
details.mancor { border: 1px dashed var(--line); border-radius: 9px; padding: 8px 12px; }
details.mancor summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
.lib-i { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 11px 16px; border-bottom: 1px solid var(--line-soft); align-items: start; }
.lib-i:last-child { border-bottom: 0; }
.lib-i .t { white-space: pre-line; font-size: 13.5px; overflow-wrap: anywhere; }
.lib-i .u { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.lib-i .actions { gap: 4px; }
.hmf { display: flex; align-items: center; gap: 6px; }
.hmf input:first-child { flex: 1 1 auto; min-width: 0; text-align: right; font-variant-numeric: tabular-nums; }
.hmf input.mm { flex: none; width: 4.2em; text-align: left; font-variant-numeric: tabular-nums; }
.hmf .colon { font-size: 20px; font-weight: 700; line-height: 1; color: var(--text); }
.hmf .u { font-size: 12px; color: var(--faint); }
.note { padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); font-size: 13px; line-height: 1.45; }
.note.warn { background: var(--warn-bg); } .note.bad { background: var(--bad-bg); }
.kv { display: grid; grid-template-columns: minmax(110px, 38%) minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-size: 13.5px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

/* ===== сторінки формуляра (однакові на екрані і на папері) ===== */
.pg { position: relative; width: 210mm; height: 148mm; background: #fff; color: #000; font-family: var(--print); overflow: hidden; flex: none; }
.pg.L { padding: 7mm 13mm 8mm 7mm; } .pg.R { padding: 7mm 7mm 8mm 13mm; } .pg.X { padding: 9mm 10mm 8mm 10mm; }
.pg .band { height: 7.5mm; display: flex; justify-content: space-between; align-items: flex-start; gap: 4mm; font-size: 7.6pt; line-height: 1.2; white-space: nowrap; }
.pg .band b { font-weight: 700; }
.pg .tbl { border: .35mm solid #000; }
.pg .hrow, .pg .row { display: grid; }
.pg .hrow { background: #ececec; border-bottom: .3mm solid #000; }
.pg .hc { padding: 1mm; text-align: center; border-right: .2mm solid #000; display: flex; flex-direction: column; justify-content: center; }
.pg .hc:last-child, .pg .c:last-child { border-right: 0; }
.pg .hc b { font-size: 6.6pt; line-height: 1.2; font-weight: 700; }
.pg .hc i { font-size: 5.6pt; line-height: 1.15; font-style: normal; color: #555; margin-top: .4mm; }
.pg .body { position: relative; overflow: hidden; }
.pg .row { border-bottom: .2mm solid #000; position: relative; }
.pg .row.fill { border-bottom: .15mm solid #9a9a9a; }
.pg .c { padding: 1.1mm; border-right: .2mm solid #000; font-size: var(--fs, 7.4pt); line-height: 1.3; overflow: hidden; white-space: pre-line; overflow-wrap: anywhere; }
.pg .c.n { text-align: right; font-variant-numeric: tabular-nums; }
.pg .c.d b { font-weight: 700; }
.pg .c .tag { display: block; font-size: 6.2pt; font-weight: 700; margin-top: .3mm; }
.pg .c.s { font-size: calc(var(--fs, 7.4pt) * .92); }
.pg .row.v .c { color: #707070; }
.pg .row.v::after { content: ""; position: absolute; left: .5mm; right: .5mm; top: 50%; border-top: .3mm solid #333; }
.pg .foot { position: absolute; left: 0; right: 0; bottom: 3.2mm; display: flex; justify-content: space-between; align-items: baseline; font-size: 8pt; font-weight: 700; }
.pg.L .foot { padding: 0 13mm 0 7mm; } .pg.R .foot { padding: 0 7mm 0 13mm; flex-direction: row-reverse; } .pg.X .foot { padding: 0 10mm; flex-direction: row-reverse; }
.pg .foot small { font-size: 5.6pt; font-weight: 400; color: #666; }
.pg h3 { margin: 0 0 1mm; font-size: 10pt; }
.pg .xsub { font-size: 7pt; color: #555; margin-bottom: 3mm; }
.pg .xt .hrow .hc { text-align: left; }
.sheet { width: 210mm; height: 297mm; display: flex; flex-direction: column; background: #fff; position: relative; }
.sheet .cut { position: absolute; left: 4mm; right: 4mm; top: 148mm; border-top: .2mm dashed #999; }

#measure { position: fixed; left: -3000mm; top: 0; visibility: hidden; pointer-events: none; }
#print-root { display: none; }

@media (max-width: 760px) {
  .tw.wide { display: none; }
  .cards { display: flex; }
  .ident h1 { font-size: 18px; }
  .fields { grid-template-columns: 1fr; }
  .card dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .log-i { grid-template-columns: 1fr; }
  .top .actions { width: 100%; }
  dialog { width: 100vw; max-width: 100vw; max-height: 100dvh; height: 100dvh; border-radius: 0; margin: 0; }
  .dlg { max-height: 100dvh; height: 100%; }
  .dlg-b { flex: 1; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .sp, .tab { transition: border-color .15s, background-color .15s; } }

@media print {
  html, body { background: #fff !important; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  #print-root .pg, #print-root .sheet { break-after: page; page-break-after: always; box-shadow: none; }
  #print-root > :last-child { break-after: auto; page-break-after: auto; }

  if ((d.schema || 1) > SCHEMA) throw new Error('Файл створено новішою версією програми. Відкрийте його в новішій версії формуляра.');
  const b = blank(), from = d.schema || 1;
  d.ident = { ...b.ident, ...d.ident };
  d.settings = { ...b.settings, ...d.settings };
  d.events = { ...b.events, ...d.events };
  for (const k of ['holders', 'auths', 'entries', 'history', 'users', 'sugg']) d[k] = Array.isArray(d[k]) ? d[k] : [];
  if (!d.pages || typeof d.pages !== 'object') d.pages = {};
  for (const e of d.entries) {
    if (e.check == null) e.check = ''; if (e.techLog == null) e.techLog = '';            // схема 2
    if (from < 3) e.major = false;                                                      // схема 3
    e.major = !!e.major; e.man = e.man || {}; if (!e.crsType) e.crsType = /\/o\//.test(e.crs || '') ? 'pilot' : 'tech';
    if (e.landings != null && e.landings !== '') e.landings = +e.landings;
  }
  if (!d.lib || !Array.isArray(d.lib.motive) || !Array.isArray(d.lib.work)) {
    d.lib = { motive: [], work: [] };
    for (const k of ['motive', 'work']) for (const t of LIB_SEED[k]) d.lib[k].push({ id: uid(), text: t });
  }
  if (from < 4) {                                                                       // схема 4: напрацювання з останнього ТО — різниця загальних
    const list = d.entries.filter(x => !x.voided).sort((a, b2) => a.date < b2.date ? -1 : a.date > b2.date ? 1 : a.seq - b2.seq);
    let prev = null;
    for (const x of list) {
      const mx = prev && prev.fhTotal != null && x.fhTotal != null ? x.fhTotal - prev.fhTotal : null;
      if (mx == null ? x.fhMx != null : mx !== x.fhMx) x.man.fhMx = true;              // записане вручну значення зберігається
      const base = prev ? (prev.major ? 0 : prev.fhMajor) : null, mj = base != null && x.fhMx != null ? base + x.fhMx : null;
      if (x.fhMajor != null && mj !== x.fhMajor) x.man.fhMajor = true;
      prev = x;
    }
    d._printedLegacy = d.entries.filter(e => e.page != null && e.printedRev === e.rev).map(e => e.id);
  }
  if (!d.users.some(u => u.role === 'chief')) d.users.unshift(chiefUser());
  d.schema = SCHEMA;
  return d;
}

const F = {

  landings: 'Кількість посадок', motive: 'Підстава для ТО', work: 'Що зроблено', wo: 'WO', crs: 'CRS', crsType: 'CRS видав', check: '№ контрольного аркушу', techLog: '№ ТБЖ',
  camoAuth: 'Повноваження САМО', amoAuth: 'Повноваження ТОР', voided: 'Анулювання', major: 'Базове ТО',
};
const HOURS = ['fhMx', 'fhTotal', 'fhMajor'];
const EDITABLE = ['date', 'fhTotal', 'landings', 'major', 'fhMx', 'fhMajor', 'motive', 'work', 'wo', 'crs', 'crsType', 'check', 'techLog', 'camoAuth', 'amoAuth'];
const fmtVal = (k, v) => k === 'major' ? (v ? 'так' : 'ні') : k === 'crsType' ? (v === 'pilot' ? 'льотчик' : 'технік') : v == null || v === '' ? '—'
  : HOURS.includes(k) ? hm(v) : k === 'date' ? fd(v) : k.endsWith('Auth') ? authLabel(v) || '—' : k === 'voided' ? (v ? 'анульовано' : '—') : String(v);
const cmpE = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq;
const chron = () => D.entries.filter(x => !x.voided).sort(cmpE);
/* Сусіди за датою для запису (новий запис — seq = нескінченність, тобто після всіх записів того ж дня) */
function neighbours(date, e) {
  const me = { date, seq: e ? e.seq : Infinity };
  const list = chron().filter(x => x !== e);
  const before = list.filter(x => cmpE(x, me) < 0), after = list.filter(x => cmpE(x, me) > 0);
  return { prev: before[before.length - 1] || null, next: after[0] || null };
}
/* Розрахунок: з останнього ТО = загальне − загальне попереднього; після базового ТО — накопичення (після запису з «Базове ТО» — з нуля) */
function derive(prev, fhTotal, major, man = {}, manVals = {}) {
  const fhMx = man.fhMx ? manVals.fhMx : prev && prev.fhTotal != null && fhTotal != null ? fhTotal - prev.fhTotal : null;
  const base = prev ? (prev.major ? 0 : prev.fhMajor) : null;
  const fhMajor = man.fhMajor ? manVals.fhMajor : base != null && fhMx != null ? base + fhMx : null;
  return { fhMx, fhMajor, base };
}
function recalcAll() {
  const out = [];

  for (const x of chron()) {
    const r = derive(prev, x.fhTotal, x.major, x.man, x);
    const ch = {};
    if (r.fhMx !== x.fhMx) ch.fhMx = [x.fhMx, r.fhMx];
    if (r.fhMajor !== x.fhMajor) ch.fhMajor = [x.fhMajor, r.fhMajor];
    if (Object.keys(ch).length) { Object.assign(x, { fhMx: r.fhMx, fhMajor: r.fhMajor, updatedAt: nowIso() }); logH('recalc', x.id, ch, 'Автоматичний перерахунок'); out.push(x); }
    prev = x;
  }

}
function addEntry(v) {
  const seq = D.entries.reduce((m, e) => Math.max(m, e.seq), 0) + 1;
  const e = { id: uid(), seq, ...v, rev: 0, voided: false, voidReason: '', voidedAt: null, voidedBy: '', createdBy: userName(), createdAt: nowIso(), updatedAt: nowIso() };
  D.entries.push(e);
  logH('create', e.id, {}, '', 0);
  const rc = recalcAll();
  changed();
  return { e, rc };
}
function editEntry(e, v, reason) {
  const ch = {};
  for (const k of EDITABLE) if (JSON.stringify(e[k] ?? null) !== JSON.stringify(v[k] ?? null)) ch[k] = [e[k] ?? null, v[k] ?? null];
  if (JSON.stringify(e.man || {}) !== JSON.stringify(v.man || {})) ch.man = [JSON.stringify(e.man || {}), JSON.stringify(v.man || {})];
  if (!Object.keys(ch).length) return null;
  Object.assign(e, v, { updatedAt: nowIso() });

  logH('change', e.id, ch, reason, e.rev);

}

/* ---------- WO і CRS ---------- */
const boardNo = () => String(D.ident.serial || '').replace(/\D/g, '').padStart(4, '0').slice(-4);
const curYY = () => String(new Date().getFullYear()).slice(-2);
const daysIn = (yy, mm) => new Date(2000 + +yy, +mm, 0).getDate();
const RX = {
  wo: /^(\d{4})(\d{2})(\d{2})(\d{2})-(\d{3})\/(\d{1,2})$/,
  tech: /^(\d{4})(\d{2})(\d{2})(\d{2})-(\d{2})\/(\d{1,2})$/,
  pilot: /^(\d{4})(\d{2})(\d{2})(\d{2})-(\d{2})\/o\/(\d{1,2})$/,
};
function parseCode(kind, s) {
  const m = String(s || '').match(RX[kind]);
  return m ? { yy: m[2], mm: m[3], dd: m[4], n: m[5], s: m[6] } : null;
}
function buildCode(kind, p) { return `${boardNo()}${p.yy}${p.mm}${p.dd}-${p.n}${kind === 'pilot' ? '/o/' : '/'}${p.s}`; }
function checkCode(kind, p) {
  const e = [];
  if (!/^\d{2}$/.test(p.yy)) e.push('рік — дві цифри');
  if (!/^\d{2}$/.test(p.mm) || +p.mm < 1 || +p.mm > 12) e.push('місяць 01–12');
  else if (!/^\d{2}$/.test(p.dd) || +p.dd < 1 || +p.dd > daysIn(p.yy || curYY(), p.mm)) e.push(`день 01–${daysIn(p.yy || curYY(), p.mm)}`);
  if (kind === 'wo' && !/^\d{3}$/.test(p.n)) e.push('номер після дефіса — три цифри');
  if (kind !== 'wo' && (!/^\d{2}$/.test(p.n) || +p.n < 1)) e.push('номер після дефіса — 01–99');
  const lo = kind === 'pilot' ? 0 : 1;
  if (!/^\d{1,2}$/.test(p.s) || +p.s < lo || +p.s > 99) e.push(`число після дробу — ${lo}–99`);
  return e;
}

const LIB_NAME = { motive: 'Підстава для ТО', work: 'Що зроблено' };
const EN_RE = /^[A-Za-z0-9\s.,;:!?'"()[\]\/\\\-–—+&%#№*=_°<>@]+$/;
function splitStd(kind, text) {
  text = String(text || '');
  const items = [...D.lib[kind]].sort((a, b) => b.text.length - a.text.length);
  for (const it of items) {
    if (text === it.text) return { std: it.id, own: '', mode: 'std' };
    if (text.startsWith(it.text + '\n')) return { std: it.id, own: text.slice(it.text.length + 1), mode: 'both' };
  }

}

let pxPerMm = 3.78;
function measureSetup() {

function measureEntries(list, fs = 7.4) {

  L.innerHTML = list.map(e => `<div class="row" style="grid-template-columns:${colTpl(LEFT)}">${cellsL(e)}</div>`).join('');

/* Записи (без анульованих) розкладаються за датою; для кожної сторінки — «відбиток» вмісту, щоб знати, що на папері застаріло */
function layout() {
  measureSetup();

  const body = PH - TOP - BAND - hh - FOOT - BOT;
  const es = chron();
  const hs = measureEntries(es);
  const sp0 = D.ident.startPage;
  const spreads = [], warnings = [];
  const spread = i => { while (spreads.length <= i) { const n = spreads.length; spreads.push({ left: sp0 + 2 * n, right: sp0 + 2 * n + 1, rows: [], used: 0, fs: 7.4 }); } return spreads[i]; };
  let i = 0;
  es.forEach((e, k) => {
    let h = hs[k];
    if (h > body) { warnings.push(`Запис від ${fd(e.date)} задовгий для однієї сторінки — на папері текст обрізано, повний текст у файлі.`); h = body; }

  while (spreads[spreads.length - 1].right < maxPrinted) spread(spreads.length);

function tablePages(title, sub, cols, rows) {
  const tpl = cols.map(c => c[1] + 'mm').join(' ');
  const rowHtml = (r, h) => `<div class="row" style="${h ? `height:${h.toFixed(2)}mm;` : ''}grid-template-columns:${tpl}">${r.map(v => `<div class="c">${esc(v)}</div>`).join('')}</div>`;
  measureSetup();
  const m = $('#mL'); m.style.width = '190mm'; m.style.setProperty('--fs', '7pt');
  m.innerHTML = rows.map(r => rowHtml(r)).join('');
  const hs = $$('.row', m).map(x => Math.max(6, x.getBoundingClientRect().height / pxPerMm));
  $('#measure').innerHTML = '';
  const avail = PH - 9 - 14 - 6 - 6 - 8;
  const pages = []; let cur = [], used = 0;
  rows.forEach((r, i) => { if (used + hs[i] > avail && cur.length) { pages.push(cur); cur = []; used = 0; } cur.push([r, hs[i]]); used += hs[i]; });
  pages.push(cur);
  const id = D.ident;
  return pages.map((p, n) => `<div class="pg X" style="--fs:7pt"><div class="band"><span><b>${esc(title)}</b>${pages.length > 1 ? ` (${n + 1}/${pages.length})` : ''}</span>
    <span>${esc(id.type)} зав. № ${esc(id.serial)} борт. № ${esc(id.reg)} · САМО ${esc(id.camo)}</span></div><div class="xsub">${esc(sub)}</div>
    <div class="tbl xt"><div class="hrow" style="grid-template-columns:${tpl}">${cols.map(c => `<div class="hc"><b>${esc(c[0])}</b></div>`).join('')}</div>
    ${p.length ? p.map(([r, h]) => rowHtml(r, h)).join('') : '<div class="row" style="grid-template-columns:1fr"><div class="c">Записів немає</div></div>'}</div>
    <div class="foot"><span></span><small>Сформовано ${fdt(nowIso())} · електронний формуляр ${APP_VERSION}</small></div></div>`);
}

function reminders() {
  const out = [];
  const st = D.settings, ev = D.events;
  if (isGuest()) return out;
  if (CU?.defaultPw) out.push({ kind: 'pw', level: 'bad', text: 'Ви увійшли зі стандартним паролем. Змініть його в розділі «Адміністрування».' });
  if (dirty) out.push({ kind: 'save', level: ageDays(ev.fileSavedAt || D.createdAt) > 1 ? 'bad' : 'warn',
    text: `Є зміни, не збережені у файл${ev.fileSavedAt ? ` (останнє збереження ${fdt(ev.fileSavedAt)})` : ''}. Без збереження вони лишаються лише в цьому браузері.` });
  const S = PS, need = needPrintList(LAY, S);
  if (need.length) {
    const rev = LAY.pages.filter(p => S[p.no].reverse).map(p => p.no);
    out.push({ kind: 'print', level: 'warn', text: `Потрібно роздрукувати сторінки: ${need.join(', ')}${rev.length ? ` (зворотні сторінки без змін: ${rev.join(', ')})` : ''}.` });
  }
  const pdf = LAY.pages.filter(p => S[p.no].pdf).map(p => p.no);
  if (pdf.length && D.entries.length) out.push({ kind: 'pdf', level: ageDays(D.updatedAt) >= st.remindPdfDays ? 'bad' : 'warn',
    text: `Потрібно (знову) зберегти в PDF сторінки: ${pdf.join(', ')}${ev.pdfAt ? ` · останній PDF ${fd(ev.pdfAt)}` : ''}.` });
  const since = ev.backupAt || D.entries.reduce((m, e) => e.createdAt < m ? e.createdAt : m, D.updatedAt);
  if (D.entries.length && (!ev.backupAt || ev.backupAt < D.updatedAt) && (!ev.backupAt || ageDays(ev.backupAt) >= st.remindBackupDays)) out.push({ kind: 'backup', level: ageDays(since) >= st.remindBackupDays ? 'bad' : 'warn',
    text: `Резервну копію ${ev.backupAt ? `робили ${fd(ev.backupAt)}` : 'ще не робили'}. Збережіть копію файлу на флешку або інший ПК.` });
  return out;
}
function renderRems() {
  const act = { save: ['Зберегти файл', 'save'], print: ['Друк', 'print'], pdf: ['Зберегти PDF', 'pdf'], backup: ['Резервна копія', 'backup'], pw: ['Змінити пароль', 'pw'] };
  $('#rems').innerHTML = reminders().map(r => `<div class="rem ${r.level}"><span>${esc(r.text)}</span>${(r.kind !== 'print' && r.kind !== 'pdf') || can('print') ? `<button class="btn sm" type="button" data-rem="${act[r.kind][1]}">${act[r.kind][0]}</button>` : ''}</div>`).join('');

  if (a === 'lib-up' || a === 'lib-down') { const j = a === 'lib-up' ? i - 1 : i + 1; if (j < 0 || j >= lib.length) return; [lib[i], lib[j]] = [lib[j], lib[i]]; changed(); return; }

const fld = (k, label, type = 'text', val = '', o = {}) => {
  const id = 'i_' + k;
  let input;
  if (type === 'select') input = `<select id="${id}" name="${k}"${o.attrs || ''}>${o.options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (type === 'textarea') input = `<textarea id="${id}" name="${k}"${o.attrs || ''}>${esc(val)}</textarea>`;
  else if (type === 'hm') {
    const [hh = '', mm = ''] = String(val ?? '').split(':');

      + `<span class="colon" aria-hidden="true">:</span><input class="mm" id="${id}_m" name="${k}_m" type="text" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="хв" value="${esc(mm)}" aria-label="${esc(label)}, хвилини (00–59)"></div>`;
  }
  else input = `<input id="${id}" name="${k}" type="${type}" value="${esc(val)}"${o.attrs || ''}>`;
  return `<div class="fld${o.full ? ' full' : ''}" data-f="${k}"><label for="${id}">${esc(label)}${o.req ? ' *' : ''}</label>${input}${o.hint ? `<span class="hint">${o.hint}</span>` : ''}<span class="msg"></span></div>`;
};
const formVals = f => Object.fromEntries([...new FormData(f).entries()]);
function showErr(form, err) {
  $$('.fld', form).forEach(x => { x.classList.remove('err'); const m = $('.msg', x); if (m) m.textContent = ''; });
  let first = null;
  for (const [k, m] of Object.entries(err)) { const x = $(`[data-f="${k}"]`, form); if (x) { x.classList.add('err'); const s = $('.msg', x); if (s) s.textContent = m; first = first || x; } }
  if (first) { first.hidden = false; first.closest('details')?.setAttribute('open', ''); first.scrollIntoView({ block: 'center', behavior: 'smooth' }); first.querySelector('input:not([readonly]),select,textarea')?.focus({ preventScroll: true }); }
  return !Object.keys(err).length;
}
const guard = (perm, fn) => (...a) => can(perm) ? fn(...a) : toast('Недостатньо повноважень');
function authOpts(org, date, current) {
  const ok = a => a.org === org && (a.active || a.id === current) && (!date || ((!a.from || a.from <= date) && (!a.to || a.to >= date)) || a.id === current);
  return [['', '— не вказано —'], ...D.auths.filter(ok).map(a => [a.id, `${holderOf(a)?.name} — ${a.code}${a.scope ? ' (' + a.scope + ')' : ''}`])];
}
/* Поля «години : хвилини»: лише цифри, хвилини 00–59, перехід між полями */
function hmCollect(raw) {
  for (const k of Object.keys(raw).filter(x => x.endsWith('_h')).map(x => x.slice(0, -2))) {
    const h = String(raw[k + '_h'] ?? '').trim(), m = String(raw[k + '_m'] ?? '').trim();
    raw[k] = h || m ? `${h || '0'}:${(m || '0').padStart(2, '0')}` : '';
    delete raw[k + '_h']; delete raw[k + '_m'];
  }
  return raw;
}
function hmBind(form) {
  $$('.hmf', form).forEach(box => {
    const [h, m] = $$('input', box);
    h.addEventListener('keydown', ev => { if ([':', '.', ',', ' '].includes(ev.key)) { ev.preventDefault(); m.focus(); m.select(); } });
    h.addEventListener('input', () => {
      const v = h.value, sp = v.match(/^\s*(\d*)\s*[:.,]\s*(\d*)/);
      if (sp) { h.value = sp[1]; m.value = sp[2].slice(0, 2); if (+m.value > 59) m.value = '59'; m.focus(); return; }
      const d = v.replace(/\D/g, ''); if (d !== v) h.value = d;
    });
    m.addEventListener('input', () => {
      let d = m.value.replace(/\D/g, '').slice(0, 2);
      if (d.length === 1 && +d > 5) d = '0' + d;
      if (+d > 59) d = '59';
      m.value = d;
    });
    m.addEventListener('blur', () => { if (m.value.length === 1) m.value = '0' + m.value; });
    m.addEventListener('keydown', ev => { if (ev.key === 'Backspace' && !m.value) { ev.preventDefault(); h.focus(); } });
  });
}
const digitsOnly = inp => inp.addEventListener('input', () => { const d = inp.value.replace(/\D/g, ''); if (d !== inp.value) inp.value = d; });

/* =====================================================================
   Пропозиції: скріншот екрана + червоні позначки + опис
   ===================================================================== */
async function captureScreen() {
  // 1) зображення сторінки засобами браузера (без інтернету)
  try {
    const w = innerWidth, h = innerHeight;
    const css = $$('style').map(s => s.textContent).join('\n');
    const src = $('.wrap'), clone = src.cloneNode(true);
    const a = $$('input,textarea,select', src), b = $$('input,textarea,select', clone);
    a.forEach((x, i) => { const y = b[i]; if (!y) return; if (x.type === 'checkbox' || x.type === 'radio') { if (x.checked) y.setAttribute('checked', ''); } else if (x.tagName === 'SELECT') { $$('option', y).forEach((o, j) => { if (j === x.selectedIndex) o.setAttribute('selected', ''); }); } else if (x.tagName === 'TEXTAREA') y.textContent = x.value; else y.setAttribute('value', x.value); });
    const cs = getComputedStyle(document.documentElement);
    const vars = [...document.styleSheets].flatMap(sh => { try { return [...sh.cssRules]; } catch { return []; } }).map(r => r.cssText).join(' ').match(/--[\w-]+(?=\s*:)/g) || [];
    const qa = t => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const varCss = qa([...new Set(vars)].map(v => `${v}:${cs.getPropertyValue(v)}`).join(';'));
    const xml = new XMLSerializer().serializeToString(clone);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="${varCss};width:${w}px;height:${h}px;overflow:hidden;background:${qa(cs.getPropertyValue('--bg'))};color:${qa(cs.getPropertyValue('--text'))};font:14px/1.5 ${qa(cs.getPropertyValue('--ui'))}"><style>${css.replace(/<\/?style>/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</style><div style="transform:translateY(${-scrollY}px)">${xml}</div></div></foreignObject></svg>`;
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();
    const c = document.createElement('canvas'), k = Math.min(2, devicePixelRatio || 1);
    c.width = w * k; c.height = h * k; const g = c.getContext('2d'); g.scale(k, k); g.drawImage(img, 0, 0);
    c.toDataURL('image/png').slice(0, 30);   // перевірка, що зображення можна зберегти
    return c;
  } catch { /* далі — спроба через знімок екрана */ }
  // 2) знімок екрана системними засобами (ПК: Chrome, Edge)
  try {
    if (!navigator.mediaDevices?.getDisplayMedia) throw 0;
    const st = await navigator.mediaDevices.getDisplayMedia({ video: true, preferCurrentTab: true });
    const v = document.createElement('video'); v.srcObject = st; v.muted = true; await v.play();
    await new Promise(r => setTimeout(r, 300));
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
    st.getTracks().forEach(t => t.stop());
    return c;
  } catch { return null; }
}

  cv.addEventListener('pointermove', ev => { if (!cur) return; cur.push(pos(ev)); redraw(); });
  cv.addEventListener('pointerup', () => { cur = null; });
  $('[data-a="undo"]', d).addEventListener('click', () => { strokes.pop(); redraw(); });
  $('[data-a="clear"]', d).addEventListener('click', () => { strokes = []; redraw(); });
  $('[data-a="file"]', d).addEventListener('change', async ev => {
    const fl = ev.target.files[0]; if (!fl) return;
    const im = new Image(); im.src = URL.createObjectURL(fl); await im.decode();
    const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0);
    strokes = []; setBase(c);
  });
  setBase(shot);
  $('#f-s', d).addEventListener('submit', ev => {
    ev.preventDefault(); const t = ev.target.text.value.trim();
    if (!showErr(ev.target, t ? {} : { text: 'Опишіть проблему або пропозицію' })) return;
    const maxW = 1400, k = Math.min(1, maxW / cv.width);
    const out = document.createElement('canvas'); out.width = Math.round(cv.width * k); out.height = Math.round(cv.height * k);
    out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height);
    D.sugg.push({ id: uid(), at: nowIso(), by: userName(), tab: where, text: t, img: base || strokes.length ? out.toDataURL('image/jpeg', .78) : '', status: 'new' });
    logH('sugg', null, { 'нова пропозиція': ['', t.slice(0, 80)] });
    changed(); d.close(); toast('Пропозицію збережено. Збережіть файл.');
  });
}

/* =====================================================================
   Файл: збереження з даними, відкриття, резервні копії
   ===================================================================== */
function fileName(suffix = '') { const id = D.ident; return `Формуляр_${id.type}_${id.serial}_борт${id.reg}${suffix}`.replace(/[\\/:*?"<>|\s]+/g, '_'); }
function buildHtml() {
  const json = JSON.stringify(D).replace(/</g, '\\u003c');
  const re = /(<script type="application\/json" id="fm-data">)[\s\S]*?(<\/script>)/;
  return SOURCE.replace(re, (m, a, b) => a + json + b);
}
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function saveFile() {
  if (isGuest()) return;
  D.events.fileSavedAt = nowIso();
  const html = buildHtml();
  try {
    if (fileHandle && fileHandle.createWritable) {
      if ((await fileHandle.queryPermission?.({ mode: 'readwrite' })) !== 'granted' && (await fileHandle.requestPermission?.({ mode: 'readwrite' })) !== 'granted') throw new Error('no-permission');
      const w = await fileHandle.createWritable(); await w.write(html); await w.close();
      dirty = false; autosave(); renderAll(); toast(`Збережено у файл ${fileHandle.name}`); return;
    }
    if (window.showSaveFilePicker) {
      const h = await window.showSaveFilePicker({ suggestedName: fileName() + '.html', types: [{ description: 'Формуляр (HTML)', accept: { 'text/html': ['.html'] } }] });
      const w = await h.createWritable(); await w.write(html); await w.close();
      fileHandle = h; dirty = false; autosave(); renderAll(); toast('Збережено. Надалі файл зберігатиметься на місці.'); return;
    }
  } catch (e) { if (e.name === 'AbortError') { D.events.fileSavedAt = null; return; } }
  download(fileName() + '.html', html, 'text/html');
  dirty = false; autosave(); renderAll();
  toast('Файл завантажено. Замініть ним попередній файл формуляра.');
}
function saveBackup() {
  if (isGuest()) return;
  D.events.backupAt = nowIso(); D.events.fileSavedAt = D.events.fileSavedAt || nowIso();
  download(fileName(`_копія_${todayIso()}`) + '.html', buildHtml(), 'text/html');
  autosave(); renderAll(); toast('Резервну копію завантажено — перенесіть її на флешку або інший ПК');
}
function exportJson() { if (!isGuest()) download(fileName(`_дані_${todayIso()}`) + '.json', JSON.stringify({ ...D, users: undefined }, null, 1), 'application/json'); }
function exportCsv() {
  if (isGuest()) return;
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['№', 'Сторінка', 'Дата', 'Напрацювання з останнього ТО', 'Напрацювання загальне', 'Напрацювання після базового ТО', 'Базове ТО', 'Посадки', 'Підстава для ТО', 'Що зроблено', 'WO', 'CRS', 'Контрольний аркуш', 'ТБЖ', 'САМО', 'ТОР', 'Зміна №', 'Анульовано', 'Вніс', 'Внесено'];
  const rows = [...D.entries].sort(cmpE).map(e => [e.seq, LAY.pageOf[e.id] ?? '', fd(e.date), hm(e.fhMx), hm(e.fhTotal), hm(e.fhMajor), e.major ? 'так' : '', e.landings, e.motive, e.work, e.wo, e.crs, e.check, e.techLog,
    authLabel(e.camoAuth), authLabel(e.amoAuth), e.rev || '', e.voided ? `${fd(e.voidedAt)}: ${e.voidReason}` : '', e.createdBy, fdt(e.createdAt)]);
  download(fileName(`_${todayIso()}`) + '.csv', '﻿' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n'), 'text/csv');
}
async function openFile() {
  if (!can('settings')) return toast('Недостатньо повноважень');
  try {
    if (window.showOpenFilePicker) {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Формуляр', accept: { 'text/html': ['.html', '.htm'], 'application/json': ['.json'] } }] });
      const f = await h.getFile(); await importText(await f.text(), f.name, h.name.endsWith('.json') ? null : h); return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  $('#file-in').value = ''; $('#file-in').click();
}
$('#file-in').addEventListener('change', async e => { const f = e.target.files[0]; if (f) await importText(await f.text(), f.name, null); });
async function importText(text, name, handle) {
  let data;
  try {
    if (/^\s*[{[]/.test(text)) data = JSON.parse(text);
    else { const m = text.match(/<script type="application\/json" id="fm-data">([\s\S]*?)<\/script>/); data = m && m[1].trim() ? JSON.parse(m[1]) : null; }
    if (!data) throw new Error('У файлі немає даних формуляра (порожній шаблон).');
    var hadUsers = Array.isArray(data.users) && data.users.length > 0;
    data = migrate(data);
  } catch (err) { openDlg({ title: 'Файл не відкрито', body: `<div class="note bad">${esc(name)}: ${esc(err.message)}</div>`, foot: '<div class="r"><button class="btn" type="button" data-close>Закрити</button></div>' }); return; }
  const go = () => {
    const keepMe = CU;
    if (!hadUsers) data.users = D.users;            // дані зі старої версії або .json — користувачі лишаються з цього файла
    D = data; fileHandle = handle; dirty = !handle; SPREAD = null;
    finishMigration();
    const same = D.users.find(u => u.login.toLowerCase() === keepMe.login.toLowerCase() && u.hash === keepMe.hash);
    autosave();
    if (same) { login(same); toast(handle ? `Відкрито ${name}` : `Дані з «${name}» перенесено. Збережіть файл.`); }
    else { showLogin(); toast('Відкрито інший файл — увійдіть з обліковим записом цього файла'); }
  };
  const d = openDlg({ title: 'Відкрити інший файл?', body: `<div class="note${dirty ? ' warn' : ''}">Поточний формуляр (${esc(D.ident.type)} № ${esc(D.ident.serial)}, записів: ${D.entries.length}) буде замінено даними з «${esc(name)}» (${esc(data.ident.type)} № ${esc(data.ident.serial)}, записів: ${data.entries.length}).${dirty ? ' <b>У поточному є незбережені зміни.</b>' : ''}</div>`,
    foot: `<div class="r"><button class="btn" type="button" data-close>Скасувати</button><button class="btn go" type="button" data-a="ok">Відкрити</button></div>` });
  $('[data-a="ok"]', d).addEventListener('click', () => { d.close(); go(); });
}
/* Після перенесення зі старої версії: сторінки, роздруковані раніше, позначаються роздрукованими */
function finishMigration() {
  if (!D._printedLegacy) return;
  const set = new Set(D._printedLegacy);
  const L = layout();
  for (const s of L.spreads) if (s.rows.length && s.rows.every(r => set.has(r.e.id))) {
    for (const [no, sig] of [[s.left, s.sigL], [s.right, s.sigR]]) { D.pages[no] = { ...(D.pages[no] || {}), pr: sig, prAt: nowIso() }; if (D.events.pdfAt && D.events.pdfAt >= D.updatedAt) Object.assign(D.pages[no], { pdf: sig, pdfAt: D.events.pdfAt }); }
  }
  delete D._printedLegacy;
}

/* ---------- меню «⋮» ---------- */
function moreMenu() {
  const g = isGuest();
  const d = openDlg({ title: 'Дії', body: `<div class="fs">
    ${can('print') ? '<button class="btn" type="button" data-m="pdf">Зберегти PDF</button>' : ''}
    ${g ? '' : '<button class="btn" type="button" data-m="backup">Резервна копія (файл з датою)</button><button class="btn" type="button" data-m="csv">Таблиця для Excel (.csv)</button>'}
    ${can('settings') ? '<button class="btn" type="button" data-m="open">Відкрити інший файл або перенести дані в нову версію…</button><button class="btn" type="button" data-m="ident">Реквізити формуляра</button>' : ''}
    <button class="btn" type="button" data-m="pw">Змінити мій пароль</button>
    <button class="btn" type="button" data-m="theme">Тема: ${{ light: 'світла', dark: 'темна' }[document.documentElement.dataset.theme] || 'як у системі'}</button>
    <button class="btn" type="button" data-m="out">${ic('out')} Вийти</button></div>`,
    foot: '<div class="r"><button class="btn" type="button" data-close>Закрити</button></div>' });
  d.addEventListener('click', ev => { const b = ev.target.closest('[data-m]'); if (!b) return; const m = b.dataset.m; if (m !== 'theme') d.close();
    ({ pdf: () => printDialog('pdf'), backup: saveBackup, csv: exportCsv, open: openFile, ident: identForm, pw: () => pwForm(CU), out: logout,
      theme: () => { const order = [undefined, 'light', 'dark']; const cur = document.documentElement.dataset.theme; const nx = order[(order.indexOf(cur) + 1) % 3];
        if (nx) document.documentElement.dataset.theme = nx; else delete document.documentElement.dataset.theme; store.set('formular.theme', nx || ''); d.close(); moreMenu(); } })[m]?.(); });

/* ---------- події ---------- */
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('dialog') && !t.closest('[data-e]')) return;
  const tab = t.closest('[data-tab]'); if (tab) { TAB = tab.dataset.tab; renderAll(); return; }
  const sp = t.closest('[data-sp]'); if (sp) { SPREAD = +sp.dataset.sp; renderAll(); return; }
  const en = t.closest('[data-e]'); if (en && !isGuest()) { const e = D.entries.find(x => x.id === en.dataset.e); if (e) { if (t.closest('dialog')) $('#dlg').close(); entryDetails(e); } return; }
  const au = t.closest('[data-auth]'); if (au) { const a = authById(au.dataset.auth); authForm(holderOf(a), a); return; }
  const zm = t.closest('[data-zoom]'); if (zm) { const s = D.sugg.find(x => x.id === zm.dataset.zoom); if (s) openDlg({ title: 'Знімок', wide: true, body: `<img src="${s.img}" alt="" style="width:100%">` }); return; }
  const rem = t.closest('[data-rem]'); if (rem) { ({ save: saveFile, print: () => printDialog('print'), pdf: () => printDialog('pdf'), backup: saveBackup, pw: () => pwForm(CU) })[rem.dataset.rem](); return; }
  const act = t.closest('[data-act]');
  if (act) ({ 'holder-new': () => holderForm(), 'holder-edit': () => holderForm(D.holders.find(h => h.id === act.dataset.h)),
    'auth-new': () => authForm(D.holders.find(h => h.id === act.dataset.h)), ident: identForm,
    'lib-new': () => libAct('lib-new', act.dataset.k), 'lib-edit': () => libAct('lib-edit', act.dataset.k, act.dataset.i), 'lib-del': () => libAct('lib-del', act.dataset.k, act.dataset.i),
    'lib-up': () => libAct('lib-up', act.dataset.k, act.dataset.i), 'lib-down': () => libAct('lib-down', act.dataset.k, act.dataset.i),
    'my-pw': () => pwForm(CU), 'user-new': () => userForm(), 'user-edit': () => userForm(D.users.find(u => u.id === act.dataset.u)),
    'sugg-new': suggestDialog, 'sugg-pdf': suggPdf, 'sugg-st': () => { if (!can('suggest')) return; const s = D.sugg.find(x => x.id === act.dataset.i); s.status = s.status === 'done' ? 'new' : 'done'; changed(); },
    backup: saveBackup, json: exportJson, csv: exportCsv, open: openFile })[act.dataset.act]?.();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches?.('tr[data-e]')) ev.target.click(); });
$('#fab').addEventListener('click', () => entryForm());
$('#b-save').addEventListener('click', saveFile);
$('#b-print').addEventListener('click', () => printDialog('print'));
$('#b-idea').addEventListener('click', suggestDialog);
$('#b-more').addEventListener('click', moreMenu);
window.addEventListener('beforeunload', ev => { if (dirty) { ev.preventDefault(); ev.returnValue = ''; } });

/* ---------- запуск ---------- */
let AUTO = null;
function offerRestore() {
  const auto = AUTO; AUTO = null;
  if (!auto || !auto.data || !(auto.data.updatedAt > D.updatedAt) || isGuest()) return;
  const d = openDlg({ title: 'Знайдено незбережені зміни', sub: `У цьому браузері є новіша версія даних від ${fdt(auto.data.updatedAt)}.`,
    body: `<div class="note warn">У файлі записів: ${D.entries.length}, у браузері: ${(auto.data.entries || []).length}. Схоже, минулого разу зміни не збережено у файл.</div>`,
    foot: `<button class="btn" type="button" data-a="no">Ні, залишити як у файлі</button><div class="r"><button class="btn go" type="button" data-a="yes">Відновити зміни</button></div>` });
  $('[data-a="yes"]', d).addEventListener('click', () => { try { const me = CU.id; D = migrate(auto.data); finishMigration(); dirty = true; CU = D.users.find(u => u.id === me) || CU; } catch { /* */ } d.close(); renderAll(); });
  $('[data-a="no"]', d).addEventListener('click', () => { autosave(); d.close(); });
}
(function boot() {
  const th = store.get('formular.theme'); if (th) document.documentElement.dataset.theme = th;
  let fromFile = null;
  try { const t = $('#fm-data').textContent.trim(); fromFile = t ? JSON.parse(t) : null; } catch { fromFile = null; }
  try { D = fromFile ? migrate(fromFile) : blank(); } catch (e) { D = blank(); }
  finishMigration();
  try { AUTO = JSON.parse(store.get('formular.autosave.' + D.id) || 'null'); } catch { AUTO = null; }
  if (!fromFile || (fromFile.schema || 1) < SCHEMA) { dirty = !!fromFile; }
  const sid = sess.get(SKEY()), u = sid && D.users.find(x => x.id === sid && x.active !== false);
  if (u) login(u); else showLogin();
})();
