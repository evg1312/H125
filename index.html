<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватний Лендінг</title>

    <!-- Стилі екрана блокировки -->
    <style>
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: white; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999; font-family: system-ui, -apple-system, sans-serif;
        }
        .pass-box { background: #2a2a2a; padding: 40px 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .pass-box h2 { margin-top: 0; font-size: 24px; }
        .pass-box p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .pass-box input { padding: 12px; font-size: 16px; margin-bottom: 15px; width: 240px; border-radius: 6px; border: 1px solid #444; background: #333; color: white; outline: none; text-align: center; }
        .pass-box input:focus { border-color: #007bff; }
        .pass-box button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; width: 100%; transition: background 0.2s; }
        .pass-box button:hover { background: #0056b3; }
        .error-msg { color: #ff6b6b; margin-top: 15px; font-size: 14px; display: none; }
        
        /* Початково приховуємо сам сайт */
        #main-content { display: none; }
    </style>
</head>
<body>

    <!-- 1. ЕКРАН АВТОРИЗАЦІЇ -->
    <div id="lock-screen">
        <div class="pass-box">
            <h2>Доступ обмежено</h2>
            <p>Введіть пароль для перегляду сайту</p>
            <input type="password" id="password-input" placeholder="Пароль" onkeydown="if(event.key === 'Enter') checkPassword()"><br>
            <button onclick="checkPassword()">Увійти</button>
            <div id="error" class="error-msg">Невірний пароль! Спробуйте ще раз.</div>
        </div>
    </div>


    <!-- 2. ОСНОВНИЙ КОНТЕНТ ВАШОГО САЙТУ -->
    <div id="main-content">
        
        <!-- ВСТАВТЕ СЮДИ весь ваш старий код лендингу (текст, картинки, блоки) -->
        <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Navigation</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --btn-bg: #e5e7eb;
            --btn-text: #1f2937;
            --btn-hover: #d1d5db;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111827;
                --btn-bg: #374151;
                --btn-text: #f9fafb;
                --btn-hover: #4b5563;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            display: flex;
            gap: 24px;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            .container {
                flex-direction: row;
            }
        }

        .btn {
            display: inline-block;
            padding: 24px 48px;
            font-size: 36px;
            font-weight: 600;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s, transform 0.1s;
            font-family: inherit;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="54.html" class="btn">54</a>
        <a href="55.html" class="btn">55</a>
        <a href="56.html" class="btn">56</a>
        <a href="57.html" class="btn">57</a>
        <a href="59.html" class="btn">59</a>
    </div>

</body>
</html>
        <!-- Кінець вашого коду -->

    </div>


    <!-- 3. СКРИПТ ПЕРЕВІРКИ -->
    <script>
        function checkPassword() {
            // Замініть '1467' на ваш будь-який секретний пароль
            const correctPassword = "1467"; 
            
            const enteredPassword = document.getElementById("password-input").value;
            const errorDiv = document.getElementById("error");

            if (enteredPassword === correctPassword) {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            } else {
                errorDiv.style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }
    </script>
</body>
</html>
