<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Navigation</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --btn-bg: #e5e7eb;
            --btn-text: #1f2937;
            --btn-hover: #d1d5db;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111827;
                --btn-bg: #374151;
                --btn-text: #f9fafb;
                --btn-hover: #4b5563;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            display: flex;
            gap: 24px;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            .container {
                flex-direction: row;
            }
        }

        .btn {
            display: inline-block;
            padding: 24px 48px;
            font-size: 36px;
            font-weight: 600;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s, transform 0.1s;
            font-family: inherit;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="54.html" class="btn">54</a>
        <a href="55.html" class="btn">55</a>
        <a href="56.html" class="btn">56</a>
        <a href="57.html" class="btn">57</a>
        <a href="59.html" class="btn">59</a>
    </div>

</body>
</html>
